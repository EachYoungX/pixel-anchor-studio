name: Desktop Build

on:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run desktop:webview2
      - run: npm run desktop:portable
      - run: npm run desktop:installer
      - run: node scripts/generate-checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: PixelAnchorStudio-${{ github.sha }}-windows-x64
          path: |
            release/PixelAnchorStudio-*-Portable.zip
            release/PixelAnchorStudio-*-Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
