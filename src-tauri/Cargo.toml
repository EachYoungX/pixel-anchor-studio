[package]
name = "pixel-anchor-studio"
version = "0.5.0"
description = "锚点像素工作台 Windows desktop shell"
authors = ["EachYoung"]
license = "MIT"
repository = "https://github.com/EachYoungX/pixel-anchor-studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pixel_anchor_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dirs = "6"
log = "0.4"
mime_guess = "2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
